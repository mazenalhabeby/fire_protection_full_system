# ===========================================
# HBCT Fire Protection - Docker Compose
# ===========================================
# Development configuration
# Usage: docker-compose up -d

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: hbct-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hbct}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hbct_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-hbct_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hbct}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hbct-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hbct-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-hbct}:${POSTGRES_PASSWORD:-hbct_dev_password}@db:5432/${POSTGRES_DB:-hbct_db}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:3002}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3001}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "3001:3001"
    networks:
      - hbct-network

  # Frontend App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
        NEXT_PUBLIC_DEPOSIT_WALLET_ADDRESS: ${NEXT_PUBLIC_DEPOSIT_WALLET_ADDRESS:-}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-http://localhost:3002}
    container_name: hbct-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - hbct-network

  # Admin Panel
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
        NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL:-http://localhost:3000}
    container_name: hbct-admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3002:3002"
    networks:
      - hbct-network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  hbct-network:
    driver: bridge
